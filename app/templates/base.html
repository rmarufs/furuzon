<!DOCTYPE html>
<html lang="{{ lang }}" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}{{ t('app.name') }}{% endblock %}</title>
  <script>
    (function () {
      var match = document.cookie.match(/(?:^|; )theme=(light|dark)/);
      var theme = match
        ? match[1]
        : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">{{ t('nav.skip_to_content') }}</a>
  <div class="shell">
    {% include "partials/sidebar.html" %}
    <div class="shell__body">
      {% include "partials/topbar.html" %}
      <main id="main" class="content">
        <div class="content__inner">
          {% block content %}{% endblock %}
        </div>
      </main>
    </div>
    {% include "partials/bottom_nav.html" %}
  </div>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
  <script type="application/json" id="i18n-data">{{ messages|tojson }}</script>
  <script type="module" src="/static/js/core/shell.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
