{% extends "auth/base_auth.html" %}

{% block title %}{{ t('auth.login.title') }} — {{ t('app.name') }}{% endblock %}

{% block auth_content %}
<form class="stack" data-auth-form="login" novalidate>
  <h1>{{ t('auth.login.title') }}</h1>

  <div class="field">
    <label class="field__label" for="login-email">{{ t('auth.email_label') }}</label>
    <input class="input" id="login-email" name="email" type="email" autocomplete="email" required>
  </div>

  <div class="field">
    <div class="auth-label-row">
      <label class="field__label" for="login-password">{{ t('auth.password_label') }}</label>
      <a class="text-small" href="/forgot-password">{{ t('auth.login.forgot_link') }}</a>
    </div>
    <div class="password-wrap">
      <input class="input" id="login-password" name="password" type="password"
             autocomplete="current-password" required>
      <button type="button" class="password-toggle" data-password-toggle="login-password">
        {{ t('auth.show_password') }}
      </button>
    </div>
  </div>

  <p class="field__error" data-form-error role="alert" hidden></p>

  <button type="submit" class="btn btn--primary">{{ t('auth.login.submit') }}</button>

  <p class="auth-footer text-small text-muted">
    <span>{{ t('auth.login.no_account') }}</span>
    <a href="/register">{{ t('auth.login.register_link') }}</a>
  </p>
</form>
{% endblock %}
